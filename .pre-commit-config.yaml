# Hooks are pinned by commit SHA with a "frozen" tag comment; Dependabot updates them.
# clang-format stays at the version named in .clang-format (Dependabot ignores it).
# Files under tests/data/ are written by independent tools (Gmsh, OpenFOAM) and are test oracles:
# no hook rewrites them, and .gitattributes keeps Git from converting them.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/data/
      - id: trailing-whitespace
        exclude: ^tests/data/
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/crate-ci/typos
    rev: 9023c1f779400877cafdd98052113fc777e2cfdc  # frozen: v1.51.1
    hooks:
      # Report only: a spelling fix written without review can corrupt identifiers and translations.
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      # Python sources only: Markdown code blocks in docs are hand-laid examples, not modules.
      - id: ruff-check
        args: [--fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c  # frozen: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 28010ddd6016e1a0f7bd232acb6536ef996ae897  # frozen: 0.29.2
    hooks:
      - id: gersemi

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-citation-file-format

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 357f7eec6dec49bf7693dc0dbec30212226d5492  # frozen: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # The error codes' registry (py/autan/) and the tables that document them must agree; the
      # SDK's test says so in about a second, before CI's Python SDK job does. On every commit: it
      # also reads files a commit may delete or rename. From uv.lock only, build backend included,
      # as CI's SDK job installs it; --inexact keeps the extras a developer installed.
      - id: error-registry
        name: error registry matches its documentation
        language: system
        entry: >-
          bash -c 'uv sync --locked --inexact --no-install-project -q &&
          uv sync --locked --inexact --no-build-isolation -q &&
          uv run --no-sync pytest -q -p no:cacheprovider py/tests/test_errors.py'
        always_run: true
        pass_filenames: false
      # Personal home directories must not reach the repository (they carry user names). Allowed:
      # the Sparks' shared GPU lock and the CI runner's home.
      - id: no-personal-paths
        name: no personal home directory paths
        language: pygrep
        entry: '/(Users|home)/(?!admin/autan-gpu\b|runner\b)[A-Za-z0-9._-]+/'
